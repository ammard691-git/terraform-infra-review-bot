name: Terraform Infra Review

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/review.py"
      - ".github/workflows/tf-review.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tf-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are never available to PRs from forks, so skip them
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect the Terraform diff
        run: git diff "origin/${{ github.base_ref }}...HEAD" -- infra > diff.txt || true

      - name: terraform fmt
        run: terraform -chdir=infra fmt -check -diff -recursive -no-color > fmt.txt 2>&1 || true

      - name: terraform init and validate
        run: |
          terraform -chdir=infra init -backend=false -input=false -no-color > init.txt 2>&1 || true
          terraform -chdir=infra validate -no-color > validate.txt 2>&1 || true

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --chdir=infra --init > tflint.txt 2>&1 || true
          tflint --chdir=infra --format compact >> tflint.txt 2>&1 || true

      - name: Checkov security scan
        run: |
          pip install --quiet checkov
          checkov -d infra --framework terraform --quiet --compact --soft-fail -o json > checkov.json 2> checkov.err || true

      - name: Offline terraform plan (mock credentials, nothing is created)
        run: |
          cp ci/ci_override.tf infra/ci_override.tf
          terraform -chdir=infra plan -refresh=false -lock=false -input=false -no-color > plan.txt 2>&1 || true
          rm -f infra/ci_override.tf

      - name: Claude review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install --quiet anthropic==1.17.0
          python scripts/review.py

      - name: Post or update the PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            const marker = '<!-- tf-review-bot -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Created a new review comment');
            }
